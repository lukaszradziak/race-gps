; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ── Wspólna baza ──────────────────────────────────────────────────────────────
[base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.2.3

; ── Produkcja (domyślny) ──────────────────────────────────────────────────────
; Serial.begin() nie jest wołany — UART0 wolny, zero narzutu.
[env:esp32dev]
extends = base
monitor_speed = 115200

; ── Debug ─────────────────────────────────────────────────────────────────────
; Flaga GPS_DEBUG włącza logowanie UBX ACK/NAK, statystyk PVT i surowych bajtów.
; Wgrywaj: pio run -e debug -t upload && pio device monitor -e debug
[env:debug]
extends = base
monitor_speed = 115200
build_flags = -D GPS_DEBUG